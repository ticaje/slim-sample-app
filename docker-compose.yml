services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: myapp_php82
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      PHP_IDE_CONFIG: "serverName=myapp"

  mysql:
    image: mysql:8.0
    container_name: myapp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: